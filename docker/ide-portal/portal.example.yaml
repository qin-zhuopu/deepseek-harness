# Portal deployment config (0008 Configuration) — mounted at /etc/ide-portal/portal.yaml.
# Secrets are NOT here: IDE_JENKINS_TOKEN arrives via --env-file at run time.
# The model key has no place in this config at all: the create-stage Jenkins
# build binds the Jenkins Secret text credential `ide-model-key` itself
# (0008 Model key flow, FR10/SR5).
domainSuffix: jereh-pe.cn
entryHost: ide.jereh-pe.cn
uid: {claim: sub, crossCheckClaim: userId, pattern: "^[0-9]{1,8}$"}
imageTag: dev-amd64                       # pin to dev-amd64-<sha> per rollout step (C6)
jenkins: {url: https://new-jenkins.jereh.cn, job: ide-provision, user: portal, tokenEnv: IDE_JENKINS_TOKEN}
iam: {issuer: https://iam.jereh.cn/idp, clientId: EnterpriseDingtalk, redirectPath: /auth/callback}
# Where the server cannot reach the IAM, seed the two published documents once
# from any network that can and point trustFile at the file (0008 offline
# trust): {discovery: <GET issuer/.well-known/openid-configuration>,
# jwks: <GET jwks_uri>} as raw JSON. Re-capture it after an IAM key rotation.
# iam: {issuer: https://iam.jereh.cn/idp, clientId: EnterpriseDingtalk, redirectPath: /auth/callback, trustFile: /etc/ide-portal/iam-trust.json}
health: {intervalSec: 30, timeoutSec: 600, pollMs: 1500}
# Entry mode (0007 FR4): false = the start page waits for the user's check
# button; true = the entry reconciles on arrival and the cold page auto-starts.
# The shipped deployment runs false; flipping this value switches modes.
autoCheck: false
# The proxy reaches the container over dc_default (0005), so bind all interfaces;
# the loopback-only rule belongs to dsh web, not to this plain service.
bindHost: 0.0.0.0
port: 8080
